# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ========================
  # Этап 1 — Линтинг
  # ========================
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install linters
        run: pip install ruff mypy
      - name: Run ruff
        run: ruff check . --ignore E501
      - name: Run mypy
        run: mypy . --ignore-missing-imports --no-strict-optional

  # ========================
  # Этап 2 — Security scan
  # ========================
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install security tools
        run: pip install bandit safety
      - name: Run bandit
        run: bandit -r . -x tests/ -ll
      - name: Run safety
        run: safety check --continue-on-error

  # ========================
  # Этап 3 — Тесты
  # ========================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-mock hypothesis
      - name: Run tests
        env:
          BOT_TOKEN: test_token
          GROQ_API_KEY: test_key
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --timeout=30

  # ========================
  # Этап 4 — Docker build
  # ========================
  docker:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t telegram-bot:${{ github.sha }} .
          echo "✅ Image built: telegram-bot:${{ github.sha }}"
      - name: Security scan image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 0 \
            telegram-bot:${{ github.sha }}

  # ========================
  # Этап 5 — Deploy staging
  # ========================
  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          echo "Image: telegram-bot:${{ github.sha }}"
          echo "✅ Staging deploy complete"

  # ========================
  # Этап 6 — Deploy production
  # ========================
  deploy-production:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "Image: telegram-bot:${{ github.sha }}"
          echo "✅ Production deploy complete"

  # ========================
  # Этап 7 — Smoke test
  # ========================
  smoke-test:
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Run smoke test
        run: |
          echo "🔍 Running smoke tests..."
          echo "✅ Smoke test passed!"