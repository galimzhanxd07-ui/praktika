name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install ruff
      - name: Run ruff
        run: ruff check . --ignore E501,F401,F811,E402 --exclude venv/

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r . -x tests/,venv/ -ll --exit-zero

 test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-mock hypothesis
          pip install aiogram groq pydantic-settings python-dotenv redis structlog
          pip install opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp
      - name: Run tests
        env:
          BOT_TOKEN: test_token
          GROQ_API_KEY: test_key
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ -v --ignore=tests/test_llm_judge.py --timeout=30